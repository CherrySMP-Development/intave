name: Build Folia Intave

on:
  push:
    branches:
      - feature/folia-support
    paths:
      - '.github/workflows/build-folia-chatgpt.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build
        run: ./gradlew clean build --stacktrace

      - name: Upload Intave jar
        uses: actions/upload-artifact@v7
        with:
          name: Intave-Folia
          path: build/libs/Intave.jar
          if-no-files-found: error
          retention-days: 7
